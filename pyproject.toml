[project]
name = "rls-twinguard"
version = "0.1.0"
description = "Behavioral before/after RLS repair checks for Supabase Evals"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.2.13"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[project.scripts]
twinguard = "twinguard.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
